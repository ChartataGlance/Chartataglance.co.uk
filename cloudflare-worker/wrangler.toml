name = "dax-r2-gallery-api"
main = "src/worker.js"
compatibility_date = "2026-05-17"

# Recommended: create a Worker custom domain like:
# https://api.chartataglance.co.uk
# You can add it in Cloudflare Dashboard > Workers & Pages > your Worker > Settings > Domains & Routes.

[[r2_buckets]]
binding = "DAX_RESULTS_BUCKET"
bucket_name = "dax-ai-results"

[vars]
PUBLIC_R2_BASE_URL = "https://charts.chartataglance.co.uk"
